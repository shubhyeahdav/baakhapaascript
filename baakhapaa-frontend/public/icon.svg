    <path d="M32 40 L24 22 L32 6 L40 22 Z" fill="none" stroke-width="2" stroke-linejoin="round"/>
    <path d="M32 14 L32 40" fill="none" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="26" r="2.6" stroke="none"/>
    <circle cx="32" cy="46" r="3.4" stroke="none"/>
  </g>
</svg>
