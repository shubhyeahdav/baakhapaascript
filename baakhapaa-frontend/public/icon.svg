<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="Baakhapaa">
  <!--
    The Pen's nib, the same geometry as src/components/ThePen.jsx, on the
    product's own ground. A nib rather than a letterform because the nib is
