<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Baakhapaa — Pre-Production Studio</title>

  <!-- A default for anything that reads the HTML without running the script.
       Every route overwrites this from src/lib/documentHead.js once React is
       up; this is what a non-JS crawler sees. -->
  <meta name="description" content="Screenplay structure, scene drafting and storyboards, built for Nepali storytelling. Three projects free, with a nineteen-lesson course and a craft linter that reads Nepali." />

  <!-- STATIC, and that is the whole point.

       src/lib/documentHead.js writes a per-route title, canonical and Open
       Graph set once React mounts. Google renders JavaScript and will see
       those; no current AI search crawler does, so for ChatGPT, Perplexity and
       Claude the only tags that exist are the ones in this file. Measured on
       the deployed site: 33 characters of visible text and zero canonical tags
       without JavaScript.

       These are the site-level defaults. The per-route layer still upgrades
       them for a rendering crawler; this is the floor underneath it. -->
  <link rel="canonical" href="https://baakhapaascript.vercel.app/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Baakhapaa" />
  <meta property="og:title" content="Baakhapaa — Pre-Production Studio" />
  <meta property="og:url" content="https://baakhapaascript.vercel.app/" />
  <meta property="og:description" content="Screenplay structure, scene drafting and storyboards, built for Nepali storytelling." />
  <meta name="twitter:card" content="summary" />

  <!-- 69% of the sites in the Addeity sample carried no structured data at
       all, and it is one of the few checklist items the measurements rate as
       real. Static, so a crawler that runs nothing still reads it. Prices are
       the published NPR figures; `offers` states the free tier first because
       that is the tier the product leads with. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Baakhapaa",
    "applicationCategory": "MultimediaApplication",
    "operatingSystem": "Web",
    "url": "https://baakhapaascript.vercel.app/",
    "description": "Pre-production for screenwriters and video creators: three-act structure, scene drafting, a craft linter that reads Nepali, storyboards and production-ready exports.",
    "inLanguage": ["en", "ne"],
    "offers": [
      { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "NPR" },
      { "@type": "Offer", "name": "Pro", "price": "999", "priceCurrency": "NPR" },
      { "@type": "Offer", "name": "Studio", "price": "2499", "priceCurrency": "NPR" }
    ]
  }
  </script>

  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Loaded WITHOUT blocking the render.
       A stylesheet in the head blocks first paint, and this one costs two DNS
       lookups and two TLS handshakes to a third party before the browser will
       draw anything. Measured on throttled mobile, the entry bundle did not
       begin loading until 2,316 ms because the font CSS sat ahead of it in the
       critical path, and mobile LCP failed the 2.5 s threshold on nine of
       fourteen routes.

       `media="print"` makes the browser fetch it at low priority and not block
       on it; the onload handler promotes it to `all` the moment it arrives.
       The fonts already carry `display=swap`, so text renders in the fallback
       stack and reflows to Spectral/Mukta/Courier Prime when they land — which
       is the trade this product should make: words on screen sooner, in a
       slightly plainer face, for a writer on a 1.6 Mbps connection.

       The noscript copy below keeps the fonts for a browser that will not run
       the handler. Self-hosting and subsetting these three families to the Latin +
       Devanagari ranges actually used is the better fix and is still open. -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Mukta:wght@300;400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap"
    media="print"
    onload="this.media='all'; this.onload=null;"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Mukta:wght@300;400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap"
    />
  </noscript>
</head>
<body style="margin:0;background:#0A0A0A;">
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
