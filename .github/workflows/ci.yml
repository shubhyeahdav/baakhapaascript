# Continuous integration.
#
# Until 2026-08-19 nothing ran either suite automatically — hundreds of tests
# that only executed when someone remembered to. The Devanagari font gate is the
# clearest case for this: `REQUIRE_SHIPPABLE_FONT` is exactly the kind of check
# that has to be enforced by a machine, because the failure it prevents (Nepali
# rendering as blank boxes on Linux) is invisible on the Windows box this is
# developed on.

name: CI

on:
  push:
    branches: [codebase, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # A real value, because auth.py refuses to boot without one.
      JWT_SECRET: ci-secret-------------------------------------------
      # The point of running on Linux: no Nirmala to fall back to, so this
      # fails if the bundled OFL font is ever removed.
      REQUIRE_SHIPPABLE_FONT: "true"
      DEMO_SEED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: baakhapaa-backend/requirements.txt

      - name: Install dependencies
        working-directory: baakhapaa-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        working-directory: baakhapaa-backend
        # The rule set is narrow and chosen (see ruff.toml): defects, not style.
        # A failure here should always mean something is actually wrong.
        run: python -m ruff check .

      - name: Dependency audit
        working-directory: baakhapaa-backend
        # PYSEC-2026-1325 (ecdsa, via python-jose) has no released fix and does
        # not apply: tokens are signed HS256, so the ECDSA path never executes.
        # Ignoring it deliberately keeps this gate meaningful instead of
        # permanently red — re-check if ALGORITHM in auth.py ever changes.
        run: python -m pip_audit --ignore-vuln PYSEC-2026-1325 --progress-spinner off

      - name: Tests
        working-directory: baakhapaa-backend
        run: python -m pytest -q

      # Retrieval is the product's differentiator and the easiest thing in the
      # repository to break without noticing. Editing a `problem` field in
      # knowledge_base.json changes an embedding, and nobody reviews an
      # embedding in a diff. This runs the golden set and fails the build if
      # real-query precision@1 drops below the committed floor.
      #
      # The floor is deliberately below the current score. It is a regression
      # gate, not a target: it should catch a change that makes retrieval
      # worse, not block one that makes it slightly less better.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Retrieval quality
        working-directory: baakhapaa-backend
        run: |
          python load_knowledge_base.py
          python eval_retrieval.py --min-p1 0.65

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: baakhapaa-frontend/package-lock.json

      - name: Install dependencies
        working-directory: baakhapaa-frontend
        run: npm ci

      - name: Tests
        working-directory: baakhapaa-frontend
        run: npm run test:ci

      # CI=true makes CRA treat warnings as errors, which catches an unused
      # import or a broken hook rule before it reaches a deploy.
      - name: Build
        working-directory: baakhapaa-frontend
        env:
          CI: "true"
        run: npm run build

      - name: Dependency audit
        working-directory: baakhapaa-frontend
        # This step used to be non-blocking, because it reported 33 advisories
        # that all lived inside react-scripts' build toolchain and none of
        # which shipped — and a check nobody can act on trains everyone to
        # ignore it. Vite replaced react-scripts and the count is zero, so the
        # step can fail the build again and mean something when it does.
        run: npm audit --audit-level=moderate
